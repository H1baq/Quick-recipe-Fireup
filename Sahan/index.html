<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sahan — Hibaq's Kitchen</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- =========================
         MAIN EXPERIENCE
    ========================== -->

    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section
            class="hero"
            id="home"
        >

            <div class="hero-content">

                <p class="eyebrow">
                    A LITTLE KITCHEN BY HIBAQ
                </p>


                <h1>
                    A table worth
                    <br>
                    staying for.
                </h1>


                <p class="hero-description">
                    Thoughtfully cooked.
                    <br>
                    Beautifully served.
                </p>


                <button
                    class="decision-btn"
                    id="dayPickBtn"
                    type="button"
                >

                    <span>
                        ✦
                    </span>

                        Hibaq's Pick for the day

                </button>


                <!-- MONDAY - FRIDAY -->

                <ol
                    class="week-strip"
                    id="weekStrip"
                    aria-label="This week's picks"
                >
                    <!-- JavaScript will populate this -->
                </ol>

            </div>

            <div class="hero-art">
                <img
                    src="rat%20chef.jpeg"
                    alt="A little chef mouse, ready to cook"
                >
            </div>


            <div class="hero-signature">

                <span>
                    SAHAN
                </span>

                <small>
                    EST. 2026
                </small>

            </div>


            <!-- FLOATING HERO DETAILS -->

            <div class="hero-float hero-float-left">

                <span>
                    PRIVATE
                </span>

                <small>
                    DINING
                </small>

            </div>


            <div class="hero-float hero-float-right">

                <span>
                    2026
                </span>

                <small>
                    SAHAN
                </small>

            </div>

        </section>

    </main>



    <!-- =========================
         DAILY REVEAL
         Teaser clip + the day's activity,
         then the recipe once it's won
    ========================== -->

    <div
        class="modal hidden"
        id="revealModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="revealTitle"
    >

        <div class="modal-overlay"></div>


        <div class="modal-content reveal-modal">

            <button
                class="close-btn"
                id="closeRevealModal"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <!-- TEASER CLIP -->

            <div
                class="reveal-clip"
                id="revealClip"
            >

                <video
                    id="revealVideo"
                    muted
                    loop
                    playsinline
                ></video>


                <span
                    class="reveal-clip-mystery"
                    aria-hidden="true"
                >
                    ?
                </span>


                <span
                    class="reveal-clip-tag"
                    id="revealDay"
                >
                    MONDAY
                </span>

            </div>


            <div class="modal-body">

                <p
                    class="eyebrow"
                    id="revealEyebrow"
                >
                    HIBAQ'S PICK FOR THE DAY
                </p>


                <h2 id="revealTitle">
                    Today's dish is a secret…
                </h2>


                <p
                    class="reveal-prompt"
                    id="revealPrompt"
                ></p>


                <!-- ACTIVITY (quote, voice note or mini game) -->

                <div
                    class="activity"
                    id="activity"
                ></div>


                <!-- THE RECIPE -->

                <div
                    class="recipe-reveal hidden"
                    id="recipeReveal"
                >

                    <div class="modal-meta">

                        <span id="revealTime">
                            ⏱ 30 min
                        </span>


                        <span id="revealDifficulty">
                            Easy
                        </span>

                    </div>


                    <div class="recipe-details">

                        <div>

                            <h3>
                                Ingredients
                            </h3>


                            <ul id="ingredientsList"></ul>

                        </div>


                        <div>

                            <h3>
                                Method
                            </h3>


                            <ol id="stepsList"></ol>

                        </div>

                    </div>


                    <p
                        class="reveal-signoff"
                        id="revealSignoff"
                    ></p>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
        role="status"
    ></div>



    <script src="app.js"></script>

</body>

</html>
